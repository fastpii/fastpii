[project]
name = "fastpii"
version = "0.5.0"
description = "Privacy infrastructure for AI applications handling European data"
readme = "README.md"
authors = [{name = "FastPII Team", email = "support@fastpii.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["privacy", "gdpr", "czech", "pii", "compliance", "detection", "pii-detection", "data-protection", "ai", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = []

[project.scripts]
fastpii = "fastpii.cli:main"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "langchain-core>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "psutil>=5.9",
    "ruff>=0.1.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/fastpii/fastpii"
Documentation = "https://fastpii.com"
Source = "https://github.com/fastpii/fastpii"
Changelog = "https://github.com/fastpii/fastpii/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastpii*"]

[tool.setuptools.package-data]
fastpii = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["fastpii"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/fastpii"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
